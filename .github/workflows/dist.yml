name: Dist

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
          - name: windows
            os: windows-latest
            targets: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Zig for Linux cross-linking
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
      - run: cargo xtask dist --target ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-${{ matrix.name }}-${{ github.run_id }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 30
