[package]
name = "umbra-tls"
description = "自研极简 TLS 1.3 栈（Rust 版 uTLS）：ClientHello 构造/密钥调度/记录层/客户端与服务端状态机（组件 A）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
umbra-proto.workspace = true
umbra-crypto.workspace = true
umbra-fingerprint.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
ring.workspace = true
x509-parser.workspace = true
zeroize.workspace = true
rustls = { workspace = true, features = ["brotli"] }
ml-dsa.workspace = true

[dev-dependencies]
proptest.workspace = true
rcgen.workspace = true
rustls = { workspace = true, features = ["aws_lc_rs"] }
