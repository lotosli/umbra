# cargo-deny policy: licenses, advisories, dependency sources, and duplicate versions.
[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow = []
deny = []
# These duplicate versions come from currently incompatible upstream dependency
# generations. Keep this list exact so new duplicate versions are still reported.
skip = [
    # Reviewed AES-GCM 0.11 / ChaCha20-Poly1305 0.10 API generations.
    { name = "aead", version = "=0.5.2" },
    { name = "block-buffer", version = "=0.10.4" },
    { name = "cipher", version = "=0.4.4" },
    { name = "inout", version = "=0.1.4" },
    { name = "universal-hash", version = "=0.5.1" },
    { name = "chacha20", version = "=0.10.2" },
    { name = "cpufeatures", version = "=0.3.0" },
    { name = "crypto-common", version = "=0.2.2" },
    { name = "digest", version = "=0.11.3" },
    { name = "getrandom", version = "=0.4.3" },
    { name = "hybrid-array", version = "=0.4.13" },
    { name = "keccak", version = "=0.2.0" },
    { name = "rand", version = "=0.10.2" },
    { name = "rand_core", version = "=0.10.1" },
    { name = "thiserror", version = "=1.0.69" },
    { name = "thiserror-impl", version = "=1.0.69" },
    { name = "windows-sys", version = "=0.52.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
