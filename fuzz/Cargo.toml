[package]
name = "umbra-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# 独立 workspace：不被父 workspace 纳管（父已 exclude；fuzz 需 nightly + cargo-fuzz）
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
umbra-crypto = { path = "../crates/umbra-crypto" }
umbra-core = { path = "../crates/umbra-core" }
umbra-fingerprint = { path = "../crates/umbra-fingerprint" }
umbra-inner = { path = "../crates/umbra-inner" }
umbra-proto = { path = "../crates/umbra-proto" }
umbra-tls = { path = "../crates/umbra-tls" }
umbra-transport = { path = "../crates/umbra-transport" }
umbra-reality = { path = "../crates/umbra-reality" }

[[bin]]
name = "aead_open"
path = "fuzz_targets/aead_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clienthello_parse"
path = "fuzz_targets/clienthello_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_id_open"
path = "fuzz_targets/session_id_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mux_frame"
path = "fuzz_targets/mux_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "target_addr"
path = "fuzz_targets/target_addr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quic_auth_carrier"
path = "fuzz_targets/quic_auth_carrier.rs"
test = false
doc = false
bench = false

[[bin]]
name = "udp_envelope"
path = "fuzz_targets/udp_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "socks_udp"
path = "fuzz_targets/socks_udp.rs"
test = false
doc = false
bench = false
